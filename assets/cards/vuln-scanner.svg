<svg xmlns="http://www.w3.org/2000/svg" width="500" height="286" viewBox="0 0 500 286">
  <defs>
    <linearGradient id="bdvulnscanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f87171"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bgvulnscanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glvulnscanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
  </style>
  <rect x="14" y="14" width="472" height="258" rx="18" fill="none" stroke="url(#bdvulnscanner)" stroke-width="6" filter="url(#glvulnscanner)" opacity=".4"><animate attributeName="opacity" values=".3;.85;.3" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="14" y="14" width="472" height="258" rx="18" fill="url(#bgvulnscanner)"/>
  <rect x="14" y="14" width="472" height="258" rx="18" fill="none" stroke="url(#bdvulnscanner)" stroke-width="1.6"/>
  <text class="t" x="38" y="68" fill="#f0f6fc" font-size="24" font-weight="700">Vulnerability Scanner</text>
  <text class="t" x="38" y="98" fill="#9da7b3" font-size="15">A web application vulnerability scanner with a real-time</text>
  <text class="t" x="38" y="120" fill="#9da7b3" font-size="15">dashboard. Scan progress streams live over</text>
  <text class="t" x="38" y="142" fill="#9da7b3" font-size="15">WebSockets, results are stored in PostgreSQL, and it</text>
  <text class="t" x="38" y="164" fill="#9da7b3" font-size="15">sends notifications.</text>
  <rect x="38" y="196" width="70.829375" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-opacity="0.55"/>
  <text class="t" x="73.4146875" y="212.5" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">Node.js</text>
  <rect x="116.829375" y="196" width="102.21125" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-opacity="0.55"/>
  <text class="t" x="167.935" y="212.5" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">WebSockets</text>
  <rect x="227.040625" y="196" width="99.05375" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-opacity="0.55"/>
  <text class="t" x="276.5675" y="212.5" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text class="t" x="38" y="246" fill="#f87171" font-size="14" font-weight="700">&lt;/&gt;  View code</text>
</svg>
